<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Sơn mài: nền nâu đỏ, vàng nhũ, chữ màu ngà. Điểm nhấn duy nhất: dải công đoạn của tập. */
:root{--lac:#2B1416;--lac2:#361A1C;--lac3:#452326;--line:#5A3134;--gold:#D4AF5A;--gold2:#F1D58C;--egg:#F0E6D2;--mute:#B9A08E;--jade:#6DB394;--cin:#E0614A;--ink:#1A0B0C;
  --r1:6px;--r2:12px;--sans:"Be Vietnam Pro",-apple-system,sans-serif;--serif:"Lora",Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--lac);color:var(--egg);font:15px/1.6 var(--sans);
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(212,175,90,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(224,97,74,.08),transparent 60%)}
a{color:var(--gold2)}::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
button{font:inherit;font-size:13.5px;color:var(--egg);background:var(--lac3);border:1px solid var(--line);border-radius:var(--r1);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}button.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}button.gold:hover{background:var(--gold2)}
button.ghost{background:transparent}
input,textarea{font:inherit;color:var(--egg);background:var(--ink);border:1px solid var(--line);border-radius:var(--r1);padding:7px 10px}
input:focus,textarea:focus{border-color:var(--gold);outline:none}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh}
aside{border-right:1px solid var(--line);background:rgba(26,11,12,.35);display:flex;flex-direction:column;min-height:0}
/* tab kênh: mỗi kênh một nút, kênh đang chọn nền vàng */
.chans{display:flex;gap:0;margin:14px 14px 0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--lac2)}
.chans button{flex:1;border:0;border-radius:0;background:none;padding:9px 8px;font-weight:600;font-size:14px;color:var(--mute)}
.chans button+button{border-left:1px solid var(--line)}.chans button:hover{color:var(--egg)}.chans button.on{background:var(--gold);color:var(--ink)}
.brand{padding:16px 18px 12px;display:flex;align-items:baseline;gap:10px}
.brand h1{font:700 22px/1 var(--serif);margin:0;color:var(--gold2)}
.brand span{color:var(--mute);font-size:12.5px}
.search{margin:0 14px 10px}.search input{width:100%}
.navbtn{margin:0 14px 10px;display:flex;gap:8px}.navbtn button{flex:1}
.list{overflow:auto;padding:0 8px 20px;flex:1}
.ep{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:8px;border-radius:var(--r1);cursor:pointer;border:1px solid transparent;width:100%;text-align:left;background:none}
.ep:hover{background:var(--lac2)}.ep.on{background:var(--lac3);border-color:var(--line)}
.ep .th{width:74px;aspect-ratio:16/9;border-radius:4px;background:var(--lac3) center/cover;box-shadow:0 0 0 1px var(--line)}
.ep b{display:block;font-weight:500;font-size:13.5px;line-height:1.35}.ep small{color:var(--mute);font-size:12px}
main{overflow:auto;min-height:0}
.wrap{max-width:1180px;margin:0 auto;padding:26px 32px 80px}
.head{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
.head h2{font:700 32px/1.2 var(--serif);margin:0 0 8px;color:var(--egg);text-wrap:balance}
.head .meta{color:var(--mute);font-size:13px}.head .note{margin-top:12px;color:var(--mute);font-size:13px;max-width:70ch;line-height:1.5}
.cover{width:300px;aspect-ratio:16/9;border-radius:var(--r2);background:var(--lac3) center/cover;box-shadow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.35);cursor:zoom-in}
/* dải công đoạn */
.steps{display:grid;grid-template-columns:repeat(9,1fr);margin:26px 0 22px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--lac2)}
.step{position:relative;padding:12px 12px 11px;border:0;border-right:1px solid var(--line);border-radius:0;background:none;text-align:left;display:flex;flex-direction:column;gap:2px}
.step:last-child{border-right:0}.step:hover{background:var(--lac3)}
.step .n{font:600 12px/1 var(--serif);color:var(--mute)}.step .t{font-weight:600;font-size:14px}.step .s{font-size:11.5px;color:var(--mute)}
.step.done .n{color:var(--jade)}.step.done .n::after{content:" ✓"}
.step.on{background:var(--gold);color:var(--ink)}.step.on .n,.step.on .s{color:rgba(26,11,12,.7)}
.step.on::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}
.panel{background:var(--lac2);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mute{color:var(--mute);font-size:13px}
h3{font:600 19px/1.3 var(--serif);color:var(--gold2);margin:22px 0 10px}
.md{max-width:76ch;font-size:15.5px}.md h1,.md h2,.md h3{font-family:var(--serif);color:var(--gold2)}.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--line);padding:4px 9px}.md blockquote{border-left:3px solid var(--gold);margin:0;padding-left:14px;color:var(--mute)}
.say{white-space:pre-wrap;margin:10px 0 0;max-width:80ch;font-size:15.5px;line-height:1.75;max-height:280px;overflow:auto;padding-right:8px}
.chap{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.chap h4{margin:0;font:600 16px/1.3 var(--serif)}
.pill{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:1px 9px}.pill.ok{color:var(--jade);border-color:rgba(109,179,148,.5)}
textarea.ed{width:100%;min-height:68vh;font:14px/1.65 ui-monospace,Menlo,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.grid figure{margin:0}.grid img{width:100%;display:block;border-radius:var(--r1);cursor:zoom-in;background:#000;box-shadow:0 0 0 1px var(--line)}
.grid figcaption{font-size:12px;color:var(--mute);margin-top:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
.thumbs img{width:100%;border-radius:var(--r2);cursor:zoom-in;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.3)}
.thumbs .mini{width:160px;border-radius:4px;margin-top:8px;cursor:default;box-shadow:0 0 0 1px var(--line)}
video{width:100%;border-radius:var(--r2);background:#000;display:block}
.short{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.short video{aspect-ratio:9/16;max-height:444px;object-fit:contain}
.short .nov{aspect-ratio:9/16;border:1px dashed var(--line);border-radius:var(--r2);display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:12px}
.cb{background:var(--ink);border:1px solid var(--line);border-radius:var(--r1);padding:8px 10px;margin:6px 0 12px;white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.short.done{opacity:.62}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:18px}.vids .panel{margin:0}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px}.kv dt{color:var(--mute)}.kv dd{margin:0}
.lb{position:fixed;inset:0;background:rgba(10,4,5,.9);display:flex;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}.lb img{max-width:95vw;max-height:93vh;border-radius:var(--r1)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--jade);color:var(--ink);padding:9px 16px;border-radius:var(--r1);font-weight:600;z-index:50}.toast.bad{background:var(--cin)}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r2)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.feed .panel{margin:0;display:flex;flex-direction:column;gap:10px}.feed img{width:100%;border-radius:var(--r1);cursor:zoom-in}
.feed b{font-weight:600;word-break:break-all}
/* kênh Người que 3D (kiểu rick) */
pre.json{background:var(--ink);border:1px solid var(--line);border-radius:var(--r1);padding:12px 14px;font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:70vh;overflow:auto;margin:0}
.docs{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}.docs .it{display:block;width:100%;text-align:left;margin:3px 0;background:none;border:1px solid transparent}.docs .it.on{background:var(--lac3);border-color:var(--line)}
.gate{font-size:12px;border-radius:20px;padding:1px 9px;border:1px solid var(--line)}.gate.ok{color:var(--jade);border-color:rgba(109,179,148,.5)}.gate.bad{color:var(--cin);border-color:rgba(224,97,74,.5)}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{max-height:40vh}.head{grid-template-columns:1fr}.steps{grid-template-columns:repeat(4,1fr)}.vids{grid-template-columns:1fr}.wrap{padding:18px 16px 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef } = React, html = htm.bind(React.createElement);
let CH = 'example';   // kênh đang chọn (tab ở đầu cột trái); mọi lời gọi API và đường dẫn file đều kèm kênh
const F = p => '/f/' + CH + '/' + p.split('/').map(encodeURIComponent).join('/');
const md = s => ({ __html: window.marked ? marked.parse(s || '') : (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) });
const ago = t => { const a = Date.now() / 1000 - t; return a < 90 ? 'vừa xong' : a < 3600 ? Math.round(a / 60) + ' phút trước' : a < 86400 ? Math.round(a / 3600) + ' giờ trước' : new Date(t * 1000).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }); };
const size = n => n > 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.round(n / 1e3) + ' KB';
const num = n => n.toLocaleString('vi-VN');
async function api(u, body) { if (body) body = { ch: CH, ...body }; else u += (u.includes('?') ? '&' : '?') + 'ch=' + CH;
  const r = await fetch(u, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); const j = await r.json(); j._code = r.status; return j; }
let toastFn = () => {}, zoomFn = () => {};
const copy = async (t, what) => { try { await navigator.clipboard.writeText(t); toastFn('Đã copy ' + what); } catch { toastFn('Không copy được', true); } };

const STEPS = [
  ['idea', 'Ý tưởng', E => E.backlog || E.docs.backlog_md ? 'có trong backlog' : 'chưa có', E => !!(E.backlog || E.docs.backlog_md)],
  ['outline', 'Dàn ý', E => E.docs.outline ? ago(E.docs.outline.mtime) : 'chưa có', E => !!E.docs.outline],
  ['script', 'Kịch bản', E => E.docs.script ? num(E.chapters.reduce((a, c) => a + c.chars, 0)) + ' ký tự' : 'chưa có', E => !!E.docs.script],
  ['voice', 'Giọng', E => E.clips ? E.clips + ' câu đã thu' : 'chưa thu', E => E.clips > 0],
  ['scenes', 'Hình', E => E.prev.length ? E.prev.length + ' ảnh soát' : 'chưa có', E => E.prev.length > 0],
  ['video', 'Video', E => { const r = E.videos.filter(v => !v.test).length, x = E.videos.length - r; return r ? 'có bản thật' : x ? x + ' bản xem thử' : 'chưa render'; }, E => E.videos.some(v => !v.test)],
  ['thumb', 'Ảnh bìa', E => E.thumbs.length ? E.thumbs.length + ' phương án' : 'chưa có', E => E.thumbs.length > 0],
  ['post', 'Đăng bài', E => E.docs.post ? 'post.md sẵn' : 'chưa có', E => !!E.docs.post],
  ['shorts', 'Shorts', E => E.shorts_n ? E.shorts_n + ' clip' : E.shorts_post ? 'có tiêu đề, chưa cắt' : 'chưa có', E => E.shorts_n > 0],
];

function Doc({ path, title }) {
  const [T, setT] = useState(null), [ed, setEd] = useState(false), [val, setVal] = useState('');
  const load = useCallback(() => api('/api/text?p=' + encodeURIComponent(path)).then(setT), [path]);
  useEffect(() => { setEd(false); load(); }, [load]);
  if (!T) return html`<div class="mute">Đang tải…</div>`;
  if (T.err) return html`<div class="empty">${T.err}</div>`;
  const raw = /\.(json|csv|log)$/.test(path), editable = !/\.(json|log)$/.test(path);
  const save = async () => { const r = await api('/api/save', { p: path, text: val, mtime: T.mtime });
    if (r._code === 409) { alert(r.msg); return; } if (r.err) return toastFn(r.err, true); toastFn('Đã lưu ' + path); setEd(false); load(); };
  return html`<div class="panel">
    <div class="row" style=${{ marginBottom: '10px' }}>${title && html`<b>${title}</b>`}<span class="mute">${path} · sửa ${ago(T.mtime)}</span><span class="sp"></span>
      ${ed ? html`<button class="gold" onClick=${save}>Lưu</button><button class="ghost" onClick=${() => setEd(false)}>Huỷ</button>`
        : html`${editable && html`<button class="gold" onClick=${() => { setVal(T.text); setEd(true); }}>Sửa</button>`}<button onClick=${() => copy(T.text, 'cả file')}>Copy cả file</button>`}</div>
    ${ed ? html`<textarea class="ed" value=${val} onInput=${e => setVal(e.target.value)}></textarea><div class="mute" style=${{ marginTop: '6px' }}>Bản cũ tự chép vào _to_delete/web_bak/ trước khi ghi.</div>`
      : raw ? html`<pre class="json">${T.text}</pre>` : html`<div class="md" dangerouslySetInnerHTML=${md(T.text)}></div>`}</div>`;
}

function Idea({ E }) {
  return html`<div>${E.backlog ? html`<div class="panel"><dl class="kv">${Object.entries(E.backlog).filter(([, v]) => v).map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}</dl></div>` : E.docs.backlog_md ? '' : html`<div class="empty">Tập này chưa có dòng trong backlog.csv.</div>`}
    <h3>Nhật ký tiến độ</h3>${E.status_lines.length ? E.status_lines.slice().reverse().map(l => html`<div class="panel mute" style=${{ fontSize: '13.5px' }}>${l.replace(/^- /, '')}</div>`) : html`<div class="mute">${E.kind === 'kit' ? 'backlog.md' : 'STATUS.md'} chưa nhắc tập này.</div>`}
    ${E.docs.backlog_md && html`<h3>Danh sách đề tài của kênh</h3><${Doc} path=${E.docs.backlog_md.p} />`}
    ${E.docs.facts && html`<h3>Dữ kiện đã kiểm (research/facts.md)</h3><${Doc} path=${E.docs.facts.p} />`}</div>`;
}

function Script({ E }) {
  const P = E.pack, items = P.length ? P.map(x => ({ n: x.name, t: x.text, c: x.chars, ok: x.mp3.length > 0 })) : E.chapters.map(c => ({ n: c.name, t: c.text, c: c.chars }));
  const total = items.reduce((a, x) => a + x.c, 0);
  return html`<div>
    <div class="panel row"><div><b>Lời đọc để thu giọng</b><div class="mute">${P.length ? `Gói VBee ${E.kind === 'kit' ? 'voice' : 'audio'}/vbee_ui/ · ${P.length} phần` : `Chưa có gói VBee. Đây là lời theo chương trong ${E.kind === 'kit' ? 'script.md' : 'episode.yaml'} đã áp cách đọc, để xem; gói thu chính thức nhờ Claude tạo.`}</div></div><span class="sp"></span><span class="pill">${num(total)} ký tự</span></div>
    ${items.map(x => html`<div class="panel"><div class="chap"><div class="row"><h4>${x.n}</h4><span class="pill">${num(x.c)} ký tự</span>${x.ok != null && html`<span class=${'pill' + (x.ok ? ' ok' : '')}>${x.ok ? 'đã có mp3' : 'chưa có mp3'}</span>`}</div>
      <button class="gold" onClick=${() => copy(x.t, x.n)}>Copy</button></div><div class="say">${x.t}</div></div>`)}
    <h3>script.md</h3>${E.docs.script ? html`<${Doc} path=${E.docs.script.p} />` : html`<div class="empty">Chưa có script.md.</div>`}</div>`;
}

function Voice({ E, reload }) {
  const [dir, setDir] = useState(localStorage.getItem('vdir') || '~/Downloads'), [R, setR] = useState(null), [sel, setSel] = useState({});
  const [show, setShow] = useState({});
  const parts = [...E.pack].sort((a, b) => (a.name === 'tat_ca' ? -1 : 0) - (b.name === 'tat_ca' ? -1 : 0));
  const names = E.pack.map(x => x.name + '.mp3');
  const look = async () => { localStorage.setItem('vdir', dir); const r = await api('/api/lsaudio?dir=' + encodeURIComponent(dir)); setR(r);
    const s = {}; (r.files || []).forEach(f => { if (names.includes(f.name)) s[f.name] = { on: true, to: f.name }; }); setSel(s); };
  const go = async () => { const files = Object.entries(sel).filter(([, v]) => v.on).map(([n, v]) => ({ name: n, to: v.to || n })); if (!files.length) return toastFn('Chưa chọn file nào', true);
    const r = await api('/api/copyvoice', { id: E.id, dir: R.dir, files }); if (r.err) return toastFn(r.err, true); toastFn('Đã chép ' + r.copied.length + ' file vào tập'); reload(); };
  const upd = (n, k, v) => setSel(s => ({ ...s, [n]: { ...(s[n] || {}), [k]: v } }));
  return html`<div>
    <div class="panel"><div class="row"><b>Giọng trong tập</b><span class="sp"></span><span class="pill">${E.clips} câu đã cắt</span><span class="pill">tốc độ ${E.voice && E.voice.speed || '—'}</span></div>
      ${(E.vbee_guide || []).length > 0 && html`<div style=${{ marginTop: '10px' }}><button class="ghost" onClick=${() => setShow(o => ({ ...o, _g: !o._g }))}>${show._g ? 'Ẩn' : 'Xem'} hướng dẫn thu trên web VBee (giọng, tốc độ, đặt tên file)</button>
        ${show._g && E.vbee_guide.map(g => html`<div style=${{ marginTop: '8px' }}><${Doc} path=${g} /></div>`)}</div>`}
      ${parts.length ? html`<div class="mute" style=${{ marginTop: '10px' }}>${parts.filter(x => x.name !== 'tat_ca').length} phần · tổng ${num(parts.filter(x => x.name !== 'tat_ca').reduce((a, x) => a + x.chars, 0))} ký tự. Bấm Copy rồi dán vào ô văn bản trên web VBee; tải mp3 về, đặt tên trùng tên phần.${parts.some(x => x.name === 'tat_ca') ? ' "tat_ca" là cả tập gộp một lần dán.' : ''}</div>` : ''}
      ${parts.length ? parts.map(x => html`<div style=${{ marginTop: '10px', paddingTop: '10px', borderTop: '1px solid var(--line)' }}><div class="row"><b style=${{ minWidth: '150px' }}>${x.name === 'tat_ca' ? 'tat_ca (cả tập)' : x.name}</b><span class="mute">${num(x.chars)} ký tự</span>
          ${x.mp3.length ? html`<span class="pill ok">đã có giọng</span>` : E.clips ? '' : html`<span class="pill">chưa thu</span>`}<span class="sp"></span>
          <button class="ghost" onClick=${() => setShow(o => ({ ...o, [x.name]: !o[x.name] }))}>${show[x.name] ? 'Ẩn lời' : 'Xem lời'}</button><button class=${x.mp3.length || E.clips ? '' : 'gold'} onClick=${() => copy(x.text, x.name)}>Copy</button></div>
        ${show[x.name] && html`<div class="cb" style=${{ marginTop: '8px' }}>${x.text}</div>`}
        ${x.mp3.map(m => html`<audio controls preload="none" src=${F(m)} style=${{ marginTop: '6px' }}></audio>`)}</div>`)
        : html`<div class="mute" style=${{ marginTop: '6px' }}>Chưa có gói vbee_ui/. Nhờ Claude tạo gói khi muốn thu trên web VBee.</div>`}</div>
    <div class="panel"><b>Đưa file giọng vừa tải từ VBee vào tập</b>
      <p class="mute" style=${{ margin: '4px 0 12px' }}>Trang chỉ chép vào thư mục vbee_ui/ của tập, không xoá file gốc. Chọn tên đích trùng tên phần ở trên (ví dụ ${names[0] || 'c03_SUNG_1.mp3'}), rồi nhắn Claude cắt câu.</p>

// ———————————————— kênh Người que 3D (kiểu 'rick', dự án video/rick-short; gộp 14/11/2026). Một tập = một phim engine/films/<phim>/ ————————————————
const wordsR = E => E.lines.reduce((a, x) => a + x.text.split(/\s+/).filter(Boolean).length, 0);
const STEPS_R = [

  ['scenes', 'Hình', E => E.images.length ? E.images.length + ' ảnh soát' : 'chưa có', E => E.images.length > 0],

  ['review', 'Rà soát', E => E.docs.review ? 'nhật ký · ' + ago(E.docs.review.mtime) : 'chưa rà', E => !!E.docs.review && E.videos.some(v => v.final)],
  ['thumb', 'Ảnh bìa', E => E.thumbs.length ? E.thumbs.length + ' phương án' : 'chưa có', E => E.thumbs.length > 0],
  ['post', 'Đăng bài', E => E.docs.post ? 'post.md sẵn' : 'chưa có', E => !!E.docs.post],
];
function IdeaR({ E }) {
  return html`<div><h3 style=${{ marginTop: 0 }}>Nhật ký tiến độ</h3>${E.status_lines.length ? E.status_lines.slice().reverse().map(l => html`<div class="panel mute" style=${{ fontSize: '13.5px' }}>${l.replace(/^- /, '')}</div>`) : html`<div class="mute">STATUS.md của dự án chưa nhắc phim này.</div>`}
    <div class="panel row" style=${{ marginTop: '14px' }}><div><b>Đề tài và nghiên cứu kênh</b><div class="mute">Kho đề tài, phân tích các kênh cùng thể loại, engine và skill nằm ở nút Tài liệu (cột trái).</div></div><span class="sp"></span><button onClick=${() => { location.hash = CH + '/!docs'; }}>Mở Tài liệu</button></div></div>`;
}
function ScriptR({ E }) {
  const all = E.lines.map(x => x.text).join(' ');
  return html`<div>${E.lines.length ? html`<div class="panel row"><div><b>Lời đọc từng câu</b><div class="mute">${E.docs.plan ? 'Lấy từ film.json (mỗi câu một dòng của phim, kèm địa điểm).' : 'Lấy từ các nhịp trong script.md.'} Giọng thật chưa chốt; giọng hiện tại là giọng tạm của máy.</div></div><span class="sp"></span><span class="pill">${E.lines.length} câu · ${num(wordsR(E))} từ</span><button class="gold" onClick=${() => copy(all, 'cả lời')}>Copy cả lời</button></div>
    ${E.lines.map(x => html`<div class="panel"><div class="chap"><div class="row"><h4>${x.name}</h4><span class="pill">${x.text.split(/\s+/).filter(Boolean).length} từ</span></div><button onClick=${() => copy(x.text, x.name)}>Copy</button></div><div class="say">${x.text}</div></div>`)}` : ''}
    <h3>script.md</h3>${E.docs.script ? html`<${Doc} path=${E.docs.script.p} />` : html`<div class="empty">Chưa có script.md.</div>`}</div>`;
}
function VoiceR({ E }) {

  return html`<div><div class="panel"><div class="row"><b>Giọng đọc của phim</b><span class="sp"></span>${V.dur != null && html`<span class="pill">${V.dur} giây</span><span class="pill">${V.words} từ</span><span class="pill">${V.wpm} từ/phút cả phim</span>`}<span class=${'pill' + (V.placeholder ? '' : ' ok')}>${V.placeholder ? 'giọng tạm của máy' : 'giọng thật'}</span></div>

function PlanR({ E }) {

const GalleryR = ({ L, n }) => html`<div class="grid">${L.slice(0, n || 999).map(f => html`<figure><img loading="lazy" src=${F(f.p)} onClick=${() => zoomFn(F(f.p))} /><figcaption>${f.sub ? f.sub + '/' : ''}${f.name} · ${ago(f.mtime)}</figcaption></figure>`)}</div>`;

}
const GateR = ({ g }) => g ? html`<span class=${'gate ' + (g.err ? 'bad' : g.warn ? '' : 'ok')}>cổng: ${g.err} lỗi · ${g.warn} cảnh báo · ${g.sha}</span>` : html`<span class="gate">chưa chạy cổng</span>`;

  const fin = E.videos.filter(v => v.final), cmp = E.videos.filter(v => v.cmp), rest = E.videos.filter(v => !v.final && !v.cmp);
  const V = (v, lab) => html`<div class="panel"><div class="row" style=${{ marginBottom: '10px' }}><b>${lab}</b><span class="sp"></span>${!v.cmp && html`<${GateR} g=${v.gate} />`}<span class="mute">${ago(v.mtime)} · ${size(v.size)}</span></div>
    <video controls preload="metadata" src=${F(v.p)} style=${{ maxHeight: '70vh', objectFit: 'contain' }}></video><div class="mute" style=${{ marginTop: '6px', wordBreak: 'break-all' }}>${v.p}</div></div>`;
  const second = rest[0] || cmp[0], more = [...fin.slice(1), ...rest.slice(rest[0] ? 1 : 0), ...cmp.slice(rest[0] ? 0 : 1)];
  return html`<div><div class="vids">${fin[0] ? V(fin[0], 'Bản chốt (đã qua cổng và rà độc lập)') : html`<div class="empty">Chưa có bản chốt (review_log.md chưa ghi dòng "Bản chốt").</div>`}${second ? V(second, second.cmp ? 'Video so sánh' : 'Bản mới nhất khác') : html`<div class="empty">Không có bản khác.</div>`}</div>
    ${more.length > 0 && html`<h3>Các bản khác</h3><div class="vids">${more.map(v => V(v, v.cmp ? 'So sánh: ' + v.name : v.name))}</div>`}</div>`;
}
function ReviewR({ E }) {
  const G = E.videos.filter(v => v.gate);
  return html`<div>${G.length > 0 && html`<div class="panel"><b>Kết quả cổng máy của từng clip</b>${G.map(v => html`<div class="row" style=${{ marginTop: '8px' }}><span style=${{ minWidth: '260px' }}>${v.name}</span><${GateR} g=${v.gate} />${v.final && html`<span class="pill ok">bản chốt</span>`}</div>`)}</div>`}
    ${E.docs.review ? html`<${Doc} path=${E.docs.review.p} title="Nhật ký rà (review_log.md)" />` : html`<div class="empty">Chưa có review_log.md.</div>`}
    ${E.docs.edits && html`<h3>Bạn đã sửa trên trang</h3><${Doc} path=${E.docs.edits.p} />`}</div>`;
}
function DocsR() {
  const [G, setG] = useState(null), [cur, setCur] = useState(() => localStorage.getItem('rdoc') || null);
  useEffect(() => { api('/api/docs').then(g => { setG(g); if (!cur && g[0] && g[0].items[0]) setCur(g[0].items[0].p); }); }, []);
  if (!G) return html`<div class="wrap mute">Đang tải…</div>`;

  return html`<div class="wrap"><div class="head" style=${{ gridTemplateColumns: '1fr' }}><div><h2>Tài liệu</h2><div class="meta">Nghiên cứu kênh, phân tích kênh mẫu, engine và skill của loại video người que 3D.</div></div></div>
    <div class="docs" style=${{ marginTop: '20px' }}><div>${G.map(g => html`<div class="panel"><b>${g.name}</b>${g.items.map(i => html`<button class=${'it' + (cur === i.p ? ' on' : '')} onClick=${() => pick(i.p)}>${i.name}<div class="mute" style=${{ fontSize: '11.5px' }}>${ago(i.mtime)}</div></button>`)}</div>`)}</div>
      <div>${cur ? html`<${Doc} key=${cur} path=${cur} />` : html`<div class="empty">Chọn một tài liệu.</div>`}</div></div></div>`;

function EpisodeR({ E, load }) {
  const [tab, setTab] = useState(localStorage.getItem('rtab') || 'script');

function Recent({ open }) {
  const [R, setR] = useState(null); useEffect(() => { api('/api/recent').then(setR); }, []);
  if (!R) return html`<div class="wrap mute">Đang tải…</div>`;
  const epOf = f => (f.p.match(/^episodes\/([^/]+)\//) || f.p.match(/^engine\/(?:films|out)\/((?!chars\/)[^/]+)\//) || f.name.match(/^thumb_(.+?)_[A-Za-z0-9]+\.jpg$/) || f.name.match(/^(.+?)(_bio-long|_v\d)/) || [])[1];
  return html`<div class="wrap"><div class="head" style=${{ gridTemplateColumns: '1fr' }}><div><h2>Mới làm gần đây</h2><div class="meta">Video, ảnh bìa, ảnh soát và tài liệu vừa thay đổi, mới nhất trước.</div></div></div>
    <div class="feed" style=${{ marginTop: '22px' }}>${R.map(f => { const ext = f.name.split('.').pop().toLowerCase(), ep = epOf(f);
      return html`<div class="panel"><div class="row"><b>${f.name}</b></div><div class="mute">${ago(f.mtime)} · ${size(f.size)}</div>
        ${['jpg', 'png'].includes(ext) ? html`<img loading="lazy" src=${F(f.p)} onClick=${() => zoomFn(F(f.p))} />` : ext === 'mp4' ? html`<video controls preload="none" src=${F(f.p)}></video>` : CH === 'rick-short' && ['md', 'csv'].includes(ext) ? html`<div class="row"><button onClick=${() => { localStorage.setItem('rdoc', f.p); location.hash = CH + '/!docs'; }}>Xem trong trang</button><a href=${F(f.p)} target="_blank">Mở file thô</a></div>` : html`<a href=${F(f.p)} target="_blank">Mở file</a>`}
        ${ep && html`<div><button onClick=${() => open(ep)}>Mở tập ${ep}</button></div>`}</div>`; })}</div></div>`;
}

function App() {
  // địa chỉ: #<kênh>/<tập>  (link cũ #<tập> không có kênh = Kênh Mẫu)
  const parse = () => { const h = decodeURIComponent(location.hash.slice(1)), i = h.indexOf('/');
    if (i > 0) return [h.slice(0, i), h.slice(i + 1) || null];
    return h ? ['example', h] : [localStorage.getItem('ch') || 'example', null]; };
  const [chans, setChans] = useState([{ id: 'example', name: 'Kênh Mẫu' }]), [loc, setLoc] = useState(parse), [eps, setEps] = useState({ ch: null, L: [] }), [q, setQ] = useState(''), [toast, setToast] = useState(null), [zoom, setZoom] = useState(null);
  const [ch, cur] = loc; CH = ch;
  toastFn = (m, bad) => { setToast({ m, bad }); clearTimeout(toastFn.h); toastFn.h = setTimeout(() => setToast(null), 2600); }; zoomFn = setZoom;
  useEffect(() => { fetch('/api/channels').then(r => r.json()).then(c => { if (Array.isArray(c) && c.length) setChans(c); }); const h = () => setLoc(parse()); addEventListener('hashchange', h); return () => removeEventListener('hashchange', h); }, []);
  useEffect(() => { CH = ch; localStorage.setItem('ch', ch); api('/api/episodes').then(r => Array.isArray(r) && CH === ch && setEps({ ch, L: r })); document.title = (chans.find(c => c.id === ch) || {}).name + ' · Studio'; }, [ch, chans]);
  useEffect(() => { const k = e => e.key === 'Escape' && setZoom(null); addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  const go = (c, id) => { location.hash = c + '/' + (id || ''); setLoc([c, id || null]); };
  const open = id => go(ch, id);
  const L = (eps.ch === ch ? eps.L : []).filter(e => !q || (e.id + ' ' + e.title).toLowerCase().includes(q.toLowerCase()));   // danh sách của kênh khác thì không vẽ (ảnh sẽ trỏ sai kênh)
  const name = (chans.find(c => c.id === ch) || {}).name || ch, rick = (chans.find(c => c.id === ch) || {}).kind === 'rick';   // kênh Người que 3D: nút Shorts thành Tài liệu
  return html`<div class="app">
    <aside><div class="chans">${chans.map(c => html`<button class=${c.id === ch ? 'on' : ''} onClick=${() => { setQ(''); go(c.id, null); }}>${c.name}</button>`)}</div>
      <div class="brand"><h1>${name}</h1><span>studio</span></div>
      <div class="navbtn"><button class=${!cur ? 'gold' : ''} onClick=${() => open(null)}>Mới nhất</button>${rick ? html`<button class=${cur === '!docs' ? 'gold' : ''} onClick=${() => open('!docs')}>Tài liệu</button>` : html`<button class=${cur === '!shorts' ? 'gold' : ''} onClick=${() => open('!shorts')}>Shorts</button>`}<button class=${cur === '!disk' ? 'gold' : ''} onClick=${() => open('!disk')}>Dọn máy</button></div>
      <div class="search"><input placeholder="Tìm tập theo tên" value=${q} onInput=${e => setQ(e.target.value)} /></div>
      <div class="list">${L.map(e => html`<button class=${'ep' + (cur === e.id ? ' on' : '')} onClick=${() => open(e.id)}><span class="th" style=${e.thumb ? { backgroundImage: `url("${F(e.thumb)}")` } : {}}></span>
        <span><b>${e.title}</b><small>${e.status || '—'} · ${ago(e.mtime)}</small></span></button>`)}</div></aside>
    <main key=${ch}>${cur === '!docs' ? html`<${DocsR} />` : cur === '!shorts' ? html`<${ShortsAll} open=${(id, t) => { if (t) localStorage.setItem('tab2', t); open(id); }} />` : cur === '!disk' ? html`<${Disk} open=${(id, t) => { if (t) localStorage.setItem('tab2', t); open(id); }} />` : cur ? html`<${Episode} key=${ch + '/' + cur} id=${cur} />` : html`<${Recent} key=${ch} open=${open} />`}</main>
    ${zoom && html`<div class="lb" onClick=${() => setZoom(null)}><img src=${zoom} /></div>`}
    ${toast && html`<div class=${'toast' + (toast.bad ? ' bad' : '')}>${toast.m}</div>`}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script></body></html>
